version: '3.8'

services:
  # Strato Quantum Platform - Main Application
  app:
    build:
      context: .
      target: production
    container_name: strato-quantum-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://stratoquantum:stratoquantum2025@postgres:5432/stratoquantum
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - API_RATE_LIMIT=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - strato-network
    restart: unless-stopped
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development version
  app-dev:
    build:
      context: .
      target: dev
    container_name: strato-quantum-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://stratoquantum:stratoquantum2025@postgres:5432/stratoquantum
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-change-in-production
      - API_RATE_LIMIT=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - strato-network
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./workspaces:/app/workspaces
      - /app/backend/node_modules
    profiles:
      - development

  # PostgreSQL Database
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: strato-quantum-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stratoquantum
      - POSTGRES_USER=stratoquantum
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stratoquantum2025}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - strato-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratoquantum -d stratoquantum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: strato-quantum-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-stratoquantum2025}
    volumes:
      - redis-data:/data
    networks:
      - strato-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: strato-quantum-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - strato-network
    restart: unless-stopped
    profiles:
      - production

  # Monitoring - Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: strato-quantum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - strato-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Monitoring - Grafana (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: strato-quantum-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - strato-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  strato-network:
    driver: bridge
    name: strato-quantum-network

volumes:
  postgres-data:
    name: strato-quantum-postgres-data
  postgres-logs:
    name: strato-quantum-postgres-logs
  redis-data:
    name: strato-quantum-redis-data
  app-logs:
    name: strato-quantum-app-logs
  nginx-logs:
    name: strato-quantum-nginx-logs
  prometheus-data:
    name: strato-quantum-prometheus-data
  grafana-data:
    name: strato-quantum-grafana-data