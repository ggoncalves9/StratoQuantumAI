# Strato Quantum AI Agents - Kubernetes Deployment
# For AWS EKS deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: strato-quantum-agents
  namespace: strato-quantum
  labels:
    app: strato-quantum-agents
    version: v2.6.3
    component: ai-agents
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: strato-quantum-agents
  template:
    metadata:
      labels:
        app: strato-quantum-agents
        version: v2.6.3
        component: ai-agents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: strato-quantum-agents
      containers:
      - name: agents-core
        image: stratoquantum/agents:v2.6.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: WORKERS
          value: "4"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: strato-quantum-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: strato-quantum-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: strato-quantum-secrets
              key: secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: strato-quantum-secrets
              key: openai-api-key
        - name: AWS_REGION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['eks.amazonaws.com/region']
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

---
apiVersion: v1
kind: Service
metadata:
  name: strato-quantum-agents-service
  namespace: strato-quantum
  labels:
    app: strato-quantum-agents
    component: ai-agents
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: strato-quantum-agents

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strato-quantum-agents
  namespace: strato-quantum
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/StratoQuantumAgentsRole

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: strato-quantum-agents-ingress
  namespace: strato-quantum
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "strato-quantum-agents-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - agents.stratoquantum.com
    secretName: strato-quantum-agents-tls
  rules:
  - host: agents.stratoquantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: strato-quantum-agents-service
            port:
              number: 8000

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: strato-quantum-agents-pdb
  namespace: strato-quantum
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: strato-quantum-agents

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: strato-quantum-agents-hpa
  namespace: strato-quantum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: strato-quantum-agents
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60